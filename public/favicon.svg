<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="sr-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="sr-warm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="sr-accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="sr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1a16" />
      <stop offset="100%" stop-color="#120f0d" />
    </linearGradient>
    <filter id="sr-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#d97706" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Rounded Container with dark luxury literary backdrop -->
  <rect width="512" height="512" rx="128" fill="url(#sr-bg)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#d97706" stroke-width="3" stroke-opacity="0.4" />

  <!-- Subtle collaborative orbital arcs (representing interwoven community chapters) -->
  <path d="M 120 256 A 136 136 0 0 1 392 256" fill="none" stroke="#d97706" stroke-width="4" stroke-dasharray="12 12" stroke-opacity="0.4" />
  <path d="M 392 256 A 136 136 0 0 1 120 256" fill="none" stroke="#f59e0b" stroke-width="4" stroke-dasharray="12 12" stroke-opacity="0.25" />

  <!-- The StoryRemix Interlocking Quill (Collaborative Voices) -->
  <g filter="url(#sr-glow)" transform="translate(4, -8)">
    <!-- Right Vane: Ascending narrative wave -->
    <path d="M 256 96 C 310 130 360 180 360 250 C 360 290 330 320 286 350 C 270 330 274 270 256 220 Z"
          fill="url(#sr-warm)" opacity="0.95" />

    <!-- Left Vane: Interlocking community contribution wave -->
    <path d="M 256 96 C 202 140 152 195 152 265 C 152 305 182 335 226 365 C 242 345 238 285 256 220 Z"
          fill="url(#sr-accent)" opacity="0.95" />

    <!-- Central Spine: The unifying story thread -->
    <path d="M 256 90 Q 256 240 256 380 L 256 390 L 256 380 Z"
          fill="none" stroke="#fffbeb" stroke-width="6" stroke-linecap="round" />

    <!-- Precision Golden Nib: The point of creation -->
    <path d="M 256 376 L 272 400 L 260 436 L 256 448 L 252 436 L 240 400 Z"
          fill="url(#sr-gold)" stroke="#fef3c7" stroke-width="2" />

    <!-- Ink Slit and Breather Hole -->
    <line x1="256" y1="395" x2="256" y2="432" stroke="#1f1a16" stroke-width="3" stroke-linecap="round" />
    <circle cx="256" cy="395" r="4" fill="#1f1a16" />

    <!-- Spark of creative inspiration -->
    <circle cx="256" cy="454" r="3.5" fill="#fde68a" />
  </g>
</svg>
